# Murmur. `docker compose up -d` pulls the images built from every push to main
# (amd64, arm64). The settings are the lines marked ←; edit them, run it again.

services:
  server:
    image: ghcr.io/samdc73/murmur-server:latest # pin a build: :sha-1a2b3c4
    environment:
      MURMUR_PASSWORD: "" # ← empty: no sign-in, fine at home (see README)
      PUBLIC_URL: "" # ← where phones reach this: http://<this box> or https://<DOMAIN>
      SERVER_NAME: Home # ← what the apps call this server
      YTDLP_ARGS: "" # ← extra yt-dlp flags, e.g. --proxy socks5://…
    volumes:
      - data:/data # the database and the media; back this up
    restart: unless-stopped

  caddy:
    image: ghcr.io/samdc73/murmur-web:latest
    environment:
      DOMAIN: ":80" # ← ":80" is plain HTTP at home; a public name gets HTTPS by itself
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data # certificates
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  data:
  caddy_data:
  caddy_config:
