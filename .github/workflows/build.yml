# Every push: check the code, then build what people install — the two Docker
# images (ghcr.io/<owner>/murmur-server and murmur-web, amd64 + arm64) and the
# Android APK. A push to the default branch also publishes them as `latest`:
# the images' `latest` tag, and the APK on the rolling "latest" release.

name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: ESLint
        run: bunx eslint .
      - name: Knip
        run: bunx knip
      - name: Unit tests
        run: bun test packages server

  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: server
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/murmur-server
          tags: &tags |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
      - id: web
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/murmur-web
          tags: *tags
      # One builder, one cache: the web image reuses the build stage the
      # server image just ran.
      - name: Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.server.outputs.tags }}
          labels: ${{ steps.server.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.web.outputs.tags }}
          labels: ${{ steps.web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  apk:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Expo's CLI and React Native's Gradle plugin run on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: bun install --frozen-lockfile
      - name: Generate the native project
        working-directory: app
        run: bunx expo prebuild --platform android --no-install
      # The generated project gives Gradle a 2 GB heap, too little for R8 on
      # a runner; it has 16 GB.
      - name: Build the release APK
        working-directory: app/android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleRelease --no-daemon
      - run: cp app/android/app/build/outputs/apk/release/app-release.apk murmur.apk
      - uses: actions/upload-artifact@v7
        with:
          name: murmur-${{ github.sha }}
          path: murmur.apk
      # A fixed address for the newest build:
      # https://github.com/<owner>/murmur/releases/download/latest/murmur.apk
      - name: Publish as the "latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest murmur.apk --prerelease --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from $GITHUB_SHA on every push to ${{ github.ref_name }}. Install murmur.apk on Android; it updates the previous build in place."
